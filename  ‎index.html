<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise - Track Your Money</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>💰 SpendWise</h1>
  <p>Track your money wisely</p>

  <div class="balance-box">
    <h2>Balance: <span id="balance">0</span> KES</h2>
    <p>Income: <span id="income">0</span> | Expense: <span id="expense">0</span></p>
  </div>

  <form id="form">
    <input type="text" id="desc" placeholder="What did you spend on? e.g. Food" required>
    <input type="number" id="amount" placeholder="Amount" required>
    <select id="type">
      <option value="expense">Expense</option>
      <option value="income">Income</option>
    </select>
    <button type="submit">Add Transaction</button>
  </form>

  <h3>History</h3>
  <ul id="list"></ul>
  <button id="clear">Clear All</button>
</div>
<script src="script.js"></script>
</body>
</html>
